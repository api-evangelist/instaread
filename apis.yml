name: Instaread
description: >-
  Instaread is a media and audio technology company with two products. Its consumer app
  delivers ~15-minute audio and text summaries of bestselling books across business,
  self-help, history, health, politics, and fiction on mobile, tablet, and desktop. Its
  publisher product, Instaread Player, is a free embeddable audio widget that uses AI
  text-to-speech (including custom voice cloning) to convert website articles, blogs, and
  newsletters into natural-sounding audio, monetized for publishers through programmatic
  audio advertising. The Player is used by 200+ brands, ships ADA/WCAG accessibility
  support, an analytics dashboard, podcast distribution, and a WordPress plugin, and works
  on Squarespace, Wix, Webflow, and custom sites via a single embed code. Instaread does
  not publish a public developer API.
